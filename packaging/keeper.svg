<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The macOS icon. Apple's grid puts the shape in an 824 square centred on a
    1024 canvas, so the 100 point margin is not padding anybody chose: it is
    the room the system expects for the shadow it draws and for the icons
    either side.

    The mark on keeper's own ground. The corner on the red is the outer corner
    rather than the tight one the wordmark uses: at the small radius the inner
    square read as a stamp sitting in a box, and at this one the two shapes are
    the same shape twice and it reads as one object.

    THE FAVICON IS NOT THIS. It is the same mark with the ground dropped,
    because it is only ever seen at 16 points and at that size the ground eats
    half the red. Large, this is the better drawing. Small, that one is. They
    are the same mark either way.
  -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0b0b0c"/>
  <!-- the hairline the app draws between its own panels, so the shape has an
       edge on a dark dock instead of dissolving into it -->
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none"
        stroke="#ffffff" stroke-opacity=".14" stroke-width="4"/>
  <rect x="316" y="316" width="392" height="392" rx="88" fill="#e1062c"/>
</svg>
